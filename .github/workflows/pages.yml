name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main, feat/official-evrima-profiles-evidence-20261025] # TEMPORARY: user-approved live review without merging PR #6
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name }} # TEMPORARY: prevent PR verification cancelling live-review push deployment
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Browser regression (Chromium)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Archive browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-mobile-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
